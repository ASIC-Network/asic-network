<!doctype html>
<html><head><meta charset="utf-8"><title>globe</title>
<style>html,body{margin:0;background:#05070c}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script>
/* Offline renderer for the ASIC Network hero film (see the README's "Hero film" section).
   A dot-matrix globe turns once per loop, with the member universities from unis.csv linked by
   lifted great-circle arcs and light pulses running along them. Every moving part completes a
   whole number of cycles per loop, so the encoded video loops seamlessly. render.js pulls the
   frames out with Playwright; encode.sh turns them into the files in assets/. */
const Q = new URLSearchParams(location.search);
const W = +Q.get('w') || 1920, H = +Q.get('h') || 1080, MODE = Q.get('mode') || 'land';
const FPS = +Q.get('fps') || 24, T = +Q.get('t') || 24, FRAMES = FPS * T;
const canvas = document.getElementById('c'); canvas.width = W; canvas.height = H;
const ctx = canvas.getContext('2d');
const glowC = document.createElement('canvas'); glowC.width = W; glowC.height = H;
const gctx = glowC.getContext('2d');
const BG = '#05070c';
const LAYOUT = MODE === 'port'
  ? { cx: W * 0.5, cy: H * 0.27, R: W * 0.42 }
  : { cx: W * 0.695, cy: H * 0.6, R: H * 0.53 };
const { cx, cy, R } = LAYOUT;
const S = R / 572;                       // scale for strokes and dots relative to the 1080p layout
const TILT = 21 * Math.PI / 180;         // camera sits above the equator
const LNG0 = +Q.get('lng0') || -78;      // longitude facing the camera at t = 0
const D2R = Math.PI / 180;
const LIGHT = norm([-0.55, 0.62, 0.56]);

function norm(v){ const l = Math.hypot(...v); return v.map(x => x / l); }
function smooth(e0, e1, x){ const t = Math.min(1, Math.max(0, (x - e0) / (e1 - e0))); return t * t * (3 - 2 * t); }
// the same CSV reader as index.html: header row, quoted fields, any column order
function parseCSV(text){
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){ if (c === '"'){ if (text[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ','){ row.push(f); f = ''; }
    else if (c === '\n' || c === '\r'){ if (c === '\r' && text[i+1] === '\n') i++; row.push(f); f = ''; if (row.some(v => v.trim() !== '')) rows.push(row); row = []; }
    else f += c;
  }
  row.push(f); if (row.some(v => v.trim() !== '')) rows.push(row);
  const head = rows.shift().map(h => h.trim().toLowerCase());
  return rows.map(r => Object.fromEntries(head.map((h, j) => [h, (r[j] || '').trim()])));
}
function rng(seed){ let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function vec(lat, lng){ const a = lat * D2R, b = lng * D2R; return [Math.cos(a) * Math.sin(b), Math.sin(a), Math.cos(a) * Math.cos(b)]; }
// world vector -> camera space for a given centre longitude
function cam(v, lc){
  const c = Math.cos(-lc * D2R), s = Math.sin(-lc * D2R);
  const x = v[0] * c + v[2] * s, z = -v[0] * s + v[2] * c, y = v[1];   // spin about the pole
  const ct = Math.cos(TILT), st = Math.sin(TILT);
  return [x, y * ct - z * st, y * st + z * ct];                        // tilt toward the viewer
}
const scr = p => [cx + R * p[0], cy - R * p[1]];

let LAND = [], UNIS = [], ARCS = [], STARS = [];
async function load(){
  const land = await fetch('land.json').then(r => r.json());
  LAND = land.map(([la, lo]) => vec(la, lo));
  const rows = parseCSV(await fetch('unis.csv').then(r => r.text())).filter(r => r.university && r.lat && r.lng);
  UNIS = rows.map((r, i) => ({ name: r.university, conn: /join|connect|complet|contact/i.test(r.status), v: vec(+r.lat, +r.lng), lat: +r.lat, lng: +r.lng, ph: rng(i * 7919 + 13)() }));
  buildArcs();
  const r = rng(424242);
  for (let i = 0; i < (MODE === 'port' ? 170 : 300); i++) STARS.push([r() * W, r() * H, 0.4 + r() * 0.8, 0.05 + r() * 0.28]);
  return true;
}
const ang = (a, b) => Math.acos(Math.max(-1, Math.min(1, a.v[0] * b.v[0] + a.v[1] * b.v[1] + a.v[2] * b.v[2])));
function buildArcs(){
  // the same idea as the site's map: nearest neighbours among joined schools, a spanning tree so
  // nothing is isolated, in-progress schools hooked to their nearest neighbours, and one link
  // between each pair of continents
  const seen = new Set(), key = (a, b) => [a.name, b.name].sort().join('|');
  const add = (a, b, conn) => { const k = key(a, b); if (seen.has(k) || a === b) return; seen.add(k); ARCS.push({ a, b, conn, th: ang(a, b) }); };
  const J = UNIS.filter(u => u.conn), P = UNIS.filter(u => !u.conn);
  J.forEach(a => J.filter(b => b !== a).sort((x, y) => ang(a, x) - ang(a, y)).slice(0, 3).forEach(b => add(a, b, true)));
  const tree = (list, conn) => { const inT = [list[0]], rest = list.slice(1);
    while (rest.length){ let best = null; inT.forEach(a => rest.forEach((b, j) => { const d = ang(a, b); if (!best || d < best[2]) best = [a, j, d]; }));
      const b = rest.splice(best[1], 1)[0]; add(best[0], b, conn === null ? (best[0].conn && b.conn) : conn); inT.push(b); } };
  tree(J, true);
  P.forEach(p => UNIS.filter(b => b !== p).sort((x, y) => ang(p, x) - ang(p, y)).slice(0, 2).forEach(b => add(p, b, false)));
  const cont = u => u.lat < -10 && u.lng > 100 ? 'OC' : u.lng < -30 ? 'NA' : u.lng < 60 ? 'EU' : 'AS';
  const groups = {}; UNIS.forEach(u => (groups[cont(u)] = groups[cont(u)] || []).push(u));
  const names = Object.keys(groups);
  for (let i = 0; i < names.length; i++) for (let j = i + 1; j < names.length; j++){
    let best = null; groups[names[i]].forEach(a => groups[names[j]].forEach(b => { const d = ang(a, b); if (!best || d < best[2]) best = [a, b, d]; }));
    if (best) add(best[0], best[1], best[0].conn && best[1].conn);
  }
  const r = rng(99);
  ARCS.forEach((A, i) => {
    A.h = 0.035 + 0.30 * Math.pow(A.th / Math.PI, 0.85);               // lift: longer links fly higher
    const dur = 1.5 + 3.2 * (A.th / Math.PI);                          // seconds per trip
    A.trips = Math.max(1, Math.round(T / dur));                         // whole trips per loop
    A.ph = r(); A.dir = r() < 0.5 ? 1 : -1;
    A.pts = [];
    const n = Math.max(24, Math.round(90 * A.th / Math.PI) + 24);
    const sinT = Math.sin(A.th) || 1e-6;
    for (let k = 0; k <= n; k++){
      const s = k / n, w1 = Math.sin((1 - s) * A.th) / sinT, w2 = Math.sin(s * A.th) / sinT;
      const v = [0, 1, 2].map(q => w1 * A.a.v[q] + w2 * A.b.v[q]);
      const lift = 1 + A.h * Math.sin(Math.PI * s);
      A.pts.push(v.map(x => x * lift));
    }
  });
}

function frame(i){
  const t = (i % FRAMES) / FPS, f = t / T;                      // seconds, loop fraction
  const lc = LNG0 - 360 * f;                                      // turns west to east, like the Earth
  ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  gctx.clearRect(0, 0, W, H);

  // stars, kept off the globe
  for (const [x, y, r, a] of STARS){
    if (Math.hypot(x - cx, y - cy) < R * 1.25) continue;
    ctx.fillStyle = `rgba(200,215,255,${a})`; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
  }
  // atmosphere and body
  let g = ctx.createRadialGradient(cx, cy, R * 0.97, cx, cy, R * 1.3);
  g.addColorStop(0, 'rgba(84,140,255,0.26)'); g.addColorStop(0.18, 'rgba(60,118,240,0.10)'); g.addColorStop(1, 'rgba(47,111,214,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, R * 1.3, 0, 6.2832); ctx.fill();
  g = ctx.createRadialGradient(cx - R * 0.38, cy - R * 0.42, R * 0.05, cx, cy, R * 1.02);
  g.addColorStop(0, '#132242'); g.addColorStop(0.55, '#091124'); g.addColorStop(1, '#050912');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 6.2832); ctx.fill();

  // graticule, very faint
  ctx.lineWidth = 1 * S; ctx.strokeStyle = 'rgba(150,180,255,0.06)';
  for (let la = -60; la <= 60; la += 30){ line3d(ctx, k => vec(la, -180 + k * 4), 90, lc); }
  for (let lo = -180; lo < 180; lo += 30){ line3d(ctx, k => vec(-88 + k * 4, lo), 44, lc); }

  // land dots, batched by brightness so the canvas fills a few paths instead of thousands
  const BUCKETS = 20, paths = Array.from({ length: BUCKETS }, () => new Path2D());
  for (const v of LAND){
    const p = cam(v, lc);
    if (p[2] <= 0.0) continue;
    const lit = Math.max(0, p[0] * LIGHT[0] + p[1] * LIGHT[1] + p[2] * LIGHT[2]);
    const a = smooth(0, 0.32, p[2]) * (0.22 + 0.78 * (0.35 + 0.65 * lit));
    const b = Math.min(BUCKETS - 1, Math.floor(a * BUCKETS));
    const [x, y] = scr(p), r = Math.max(0.75, 1.32 * S * (0.6 + 0.4 * p[2]));
    paths[b].moveTo(x + r, y); paths[b].arc(x, y, r, 0, 6.2832);
  }
  paths.forEach((path, b) => { ctx.fillStyle = `rgba(206,220,248,${((b + 0.5) / BUCKETS).toFixed(3)})`; ctx.fill(path); });

  // inner rim light
  g = ctx.createRadialGradient(cx, cy, R * 0.8, cx, cy, R);
  g.addColorStop(0, 'rgba(90,150,255,0)'); g.addColorStop(1, 'rgba(120,170,255,0.16)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 6.2832); ctx.fill();

  // arcs: faint base line plus a travelling pulse
  for (const A of ARCS){
    const P = A.pts.map(v => cam(v, lc));
    const vis = P.map(p => p[2] > 0 || p[0] * p[0] + p[1] * p[1] > 1);
    const fade = P.map(p => p[2] > 0 ? smooth(-0.05, 0.25, p[2]) : 0.35);
    const n = P.length - 1;
    ctx.lineWidth = (A.conn ? 1.3 : 1.0) * S;
    ctx.setLineDash(A.conn ? [] : [5 * S, 6 * S]);
    for (let k = 0; k < n; k++){
      if (!vis[k] || !vis[k + 1]) continue;
      const [x1, y1] = scr(P[k]), [x2, y2] = scr(P[k + 1]);
      const a = (A.conn ? 0.32 : 0.2) * Math.min(fade[k], fade[k + 1]);
      ctx.strokeStyle = A.conn ? `rgba(122,167,255,${a})` : `rgba(220,230,255,${a})`;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    }
    ctx.setLineDash([]);
    // pulse: a bright head with a fading tail, a whole number of trips per loop
    let u = (f * A.trips + A.ph) % 1; if (A.dir < 0) u = 1 - u;
    const tail = 0.22, head = Math.round(u * n);
    for (let k = Math.max(0, Math.round((u - tail * A.dir) * n)); A.dir > 0 ? k < head : k > head; k += A.dir){
      const k2 = k + A.dir; if (k2 < 0 || k2 > n || !vis[k] || !vis[k2]) continue;
      const s = 1 - Math.abs(head - k) / (tail * n);
      const [x1, y1] = scr(P[k]), [x2, y2] = scr(P[k2]);
      const a = s * s * Math.min(fade[k], fade[k2]) * (A.conn ? 1 : 0.6);
      for (const c of [ctx, gctx]){
        c.lineWidth = (c === gctx ? 3.2 : 1.8) * S; c.lineCap = 'round';
        c.strokeStyle = A.conn ? `rgba(150,190,255,${a})` : `rgba(235,240,255,${a * 0.8})`;
        c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke();
      }
    }
    if (head >= 0 && head <= n && vis[head]){
      const [x, y] = scr(P[head]), a = fade[head] * (A.conn ? 1 : 0.6);
      for (const c of [ctx, gctx]){ c.fillStyle = `rgba(235,244,255,${a})`; c.beginPath(); c.arc(x, y, (c === gctx ? 3.4 : 1.9) * S, 0, 6.2832); c.fill(); }
    }
  }

  // universities: joined glow blue with a ring that pings; in progress are hollow
  for (const u of UNIS){
    const p = cam(u.v, lc); if (p[2] <= 0.02) continue;
    const a = smooth(0.02, 0.3, p[2]), [x, y] = scr(p);
    if (u.conn){
      const q = (f * 10 + u.ph) % 1;                                   // ten pings per loop
      ctx.strokeStyle = `rgba(122,167,255,${0.55 * a * (1 - q)})`; ctx.lineWidth = 1.2 * S;
      ctx.beginPath(); ctx.arc(x, y, (4 + 18 * q) * S, 0, 6.2832); ctx.stroke();
      for (const c of [ctx, gctx]){ c.fillStyle = `rgba(150,190,255,${a})`; c.beginPath(); c.arc(x, y, (c === gctx ? 6 : 3.6) * S, 0, 6.2832); c.fill(); }
      ctx.fillStyle = `rgba(245,250,255,${a})`; ctx.beginPath(); ctx.arc(x, y, 1.5 * S, 0, 6.2832); ctx.fill();
    } else {
      ctx.strokeStyle = `rgba(235,240,255,${0.8 * a})`; ctx.lineWidth = 1.4 * S;
      ctx.beginPath(); ctx.arc(x, y, 3.4 * S, 0, 6.2832); ctx.stroke();
    }
  }

  // bloom
  ctx.globalCompositeOperation = 'lighter';
  ctx.filter = `blur(${(9 * S).toFixed(1)}px)`; ctx.globalAlpha = 0.95; ctx.drawImage(glowC, 0, 0);
  ctx.filter = `blur(${(3 * S).toFixed(1)}px)`; ctx.globalAlpha = 0.6; ctx.drawImage(glowC, 0, 0);
  ctx.filter = 'none'; ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  // vignette
  g = ctx.createRadialGradient(W * 0.6, H * 0.5, Math.min(W, H) * 0.35, W * 0.55, H * 0.5, Math.max(W, H) * 0.85);
  g.addColorStop(0, 'rgba(5,7,12,0)'); g.addColorStop(1, 'rgba(5,7,12,0.55)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function line3d(c, at, n, lc){
  let open = false; c.beginPath();
  for (let k = 0; k <= n; k++){
    const p = cam(at(k), lc);
    if (p[2] > 0.02){ const [x, y] = scr(p); if (open) c.lineTo(x, y); else { c.moveTo(x, y); open = true; } } else open = false;
  }
  c.stroke();
}
window.ready = load();
window.render = i => { frame(i); return true; };
window.png = () => canvas.toDataURL('image/png');
window.info = () => ({ W, H, FRAMES, arcs: ARCS.length, unis: UNIS.length, land: LAND.length });
</script></body></html>
